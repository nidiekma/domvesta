<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Domvesta mark: two interlocked orbits, navy and orange, on a cream tile
       so it reads the same on light and dark tab bars (no colour-scheme switch).
       Favicon cut: mark at 78 %, heavier stroke for 16-32 px. Same geometry as
       src/components/Mark.astro (keep in sync); favicon.ico is rendered from this file. -->
  <defs>
    <clipPath id="dv-v"><path d="M50 50 0 0h100zM50 50 0 100h100z"/></clipPath>
    <clipPath id="dv-h"><path d="M50 50 0 0v100zM50 50 100 0v100z"/></clipPath>
    <mask id="dv-mn" maskUnits="userSpaceOnUse" x="-20" y="-20" width="140" height="140">
      <rect x="-20" y="-20" width="140" height="140" fill="#fff"/>
      <g clip-path="url(#dv-h)"><ellipse cx="50" cy="50" rx="52" ry="28.08" transform="rotate(-45 50 50)" fill="none" stroke="#000" stroke-width="18"/></g>
    </mask>
    <mask id="dv-mo" maskUnits="userSpaceOnUse" x="-20" y="-20" width="140" height="140">
      <rect x="-20" y="-20" width="140" height="140" fill="#fff"/>
      <g clip-path="url(#dv-v)"><ellipse cx="50" cy="50" rx="52" ry="28.08" transform="rotate(45 50 50)" fill="none" stroke="#000" stroke-width="18"/></g>
    </mask>
  </defs>
  <rect width="100" height="100" rx="22" fill="#f6f0e6"/>
  <g transform="translate(50 50) scale(.78) rotate(9) translate(-50 -50)" fill="none" stroke-width="9">
    <g mask="url(#dv-mn)"><ellipse cx="50" cy="50" rx="52" ry="28.08" transform="rotate(45 50 50)" stroke="#191625"/></g>
    <g mask="url(#dv-mo)"><ellipse cx="50" cy="50" rx="52" ry="28.08" transform="rotate(-45 50 50)" stroke="#fa641b"/></g>
  </g>
</svg>
